suite = "frozen_core"
provenance = "SEC EDGAR Financial Statement Data Sets 2026q3, https://www.sec.gov/files/dera/data/financial-statement-data-sets/2026q3.zip, downloaded 2026-11-24; subset: the 300 filers with the largest reported Assets plus the 10 largest other filers that filed a 10-K/A or 10-Q/A in the quarter, without co-registrant copies of another filer's filing"
usage_rights = "public domain (US government work)"
taxonomy_version = "1"
controlled_model = ["claude-haiku-5-5", "2026-11"]
permitted_tools = []
external_access = false
human_assistance = "none"
limitations = [
  "100 tasks in 10 scenario groups of about 10 tasks; group-level uncertainty rests on 10 clusters.",
  "Single quarter of data (2026q3); one filing season, so period coverage is narrow.",
  "Subset: the 300 filers with the largest reported Assets among 10-K, 10-Q and their amendments, plus the 10 largest other filers that filed a 10-K/A or 10-Q/A; small filers are absent.",
  "Only unsegmented facts with standard (non-custom) taxonomy tags are included; dimensional detail and company extensions are dropped.",
  "Amendments in the quarter mostly repeat the original values; only SHARONAI HOLDINGS INC. restates figures, so the other disambiguation tasks turn on period, fiscal calendar or parent-versus-total rules.",
  "A filing whose kept facts are identical to an earlier-accepted filing by another filer (a co-registrant copy) is left out; in this quarter that drops AEP TEXAS INC.'s copy of American Electric Power's 10-Q.",
  "Definitions carry the publisher's US-GAAP label and documentation from the newest release older than the quarter's newest (us-gaap/2025), because FSDS fills the newest release's labels from filers; tags that only us-gaap/2026 has keep its documentation and an empty label.",
  "Some filers put the same concept under different tags (Revenues or RevenueFromContractWithCustomerExcludingAssessedTax, DebtCurrent or LongTermDebtCurrent); the question does not say which, so a method that cannot inspect the data must guess or combine tags.",
  "Tasks are not fully independent: APPLE INC appears in 15 tasks, and a few tasks share a sub-fact (for example cc_exxon_fcf is the first part of cc_exxon_fcf_after_dividends).",
  "sub.prevrpt is 0 for every filing in this quarter (the source flags no filing as superseded), so the most recent filing must be found from sub.filed.",
  "Ratio and growth answers are rounded to 4 decimal places and accepted within an absolute 0.0001 (book value per share within 0.01); other numbers within a relative 1e-6.",
  "Unanswerable tasks have a null reference, reached only by an explicit abstention (the llm-sql adapter returns null only for a query result of exactly 'NOT_IN_DATABASE'); a method that abstains everywhere scores only on that group."
]

