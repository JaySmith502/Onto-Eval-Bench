suite = "frozen_core"
provenance = "SEC EDGAR Financial Statement Data Sets 2026q3, https://www.sec.gov/files/dera/data/financial-statement-data-sets/2026q3.zip, downloaded 2026-11-24; subset: the 300 filers with the largest reported Assets plus the 10 largest other filers that filed a 10-K/A or 10-Q/A in the quarter, without co-registrant copies of another filer's filing; axis and member labels from the SEC Financial Statement and Notes data sets https://www.sec.gov/files/dera/data/financial-statement-notes-data-sets/2026_07_notes.zip, https://www.sec.gov/files/dera/data/financial-statement-notes-data-sets/2026_08_notes.zip, https://www.sec.gov/files/dera/data/financial-statement-notes-data-sets/2026_09_notes.zip"
usage_rights = "public domain (US government work)"
taxonomy_version = "1"
controlled_model = ["claude-haiku-5-5", "2026-11"]
permitted_tools = []
external_access = false
human_assistance = "none"
limitations = [
  "100 tasks in 11 scenario groups of 6 to 13 tasks; group-level uncertainty rests on 11 clusters.",
  "Single quarter of data (2026q3); one filing season, so period coverage is narrow.",
  "Subset: the 300 filers with the largest reported Assets among 10-K, 10-Q and their amendments, plus the 10 largest other filers that filed a 10-K/A or 10-Q/A, without co-registrant copies (the 0.2.0 rule; the subset is unchanged).",
  "Standard taxonomy tags only: facts on company-extension tags are dropped, dimensional or not. Axes and members keep the filer's own names, since a dimensional fact is only reachable through them.",
  "Dimensional facts whose FSDS segments value is not a clean list of 'Axis=Member;' pairs (typed dimensions whose value contains '=', ';' or a line break, such as some investment identifiers) are dropped.",
  "dimensions.json labels axes and members from the SEC Financial Statement and Notes data sets (2026_07 to 2026_09): a standard element gets the publisher's label by the definitions.json rule, a filer's element the filer's label. Names that resolve to no element (typed member values) have no label.",
  "Definitions and dimension labels are gated together by information_access 'definitions'; the schema-only baseline sees neither, only the table comments in schema.sql.",
  "A segment total can appear twice: alone and with ConsolidationItems=OperatingSegments, with equal or different values (external versus total sales). Every question names which one it wants.",
  "Several filers report a parent member and its children on the same axis (Product and iPhone, NonUs and Europe); summing every member of an axis double counts.",
  "Tasks are not fully independent: MICROSOFT CORP appears in 13 tasks and CISCO SYSTEMS, INC. in 9, and several segment tasks reuse one filing (Apple, Eli Lilly, Caterpillar).",
  "Four groups (lookup, period_compare, ratio, concept_composition; 32 tasks) draw from six 10-K filers only (Microsoft, Cisco, Cardinal Health, P&G, FedEx, ADP), all on fiscal-year facts, so each is close to six filings asked several ways; 87 tasks name a filer and only 20 distinct filers are named.",
  "Some segment facts exist only with a second ConsolidationItems=OperatingSegments pair and some without (Apple against Amazon, Meta, Microsoft); schema.sql says so, but a solver that assumes ndims = 1 for every filer fails the others.",
  "Ratio and growth answers are rounded to 4 decimal places and accepted within an absolute 0.0001; other numbers within a relative 1e-6.",
  "Unanswerable tasks have a null reference, reached only by an explicit abstention (the llm-sql adapter returns null only for a query result of exactly 'NOT_IN_DATABASE'); five of the nine ask for a breakdown the filer does not report."
]

